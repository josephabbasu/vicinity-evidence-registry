name: Monthly evidence surveillance

on:
  schedule:
    - cron: "17 13 1 * *"
  workflow_dispatch:

jobs:
  surveillance:
    runs-on: ubuntu-latest
    steps:
      - name: Run VICINITY surveillance
        env:
          SURVEILLANCE_TOKEN: ${{ secrets.VICINITY_SURVEILLANCE_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 20 \
            --request POST \
            --header "X-Surveillance-Token: ${SURVEILLANCE_TOKEN}" \
            https://vicinity-evidence-api.onrender.com/api/surveillance/run
