services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creatoros
      POSTGRES_PASSWORD: creatoros
      POSTGRES_DB: creatoros
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatoros"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://creatoros:creatoros@db:5432/creatoros
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-32+byte-random-secret-in-prod}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
