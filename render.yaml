services:
  - type: web
    name: vicinity-evidence-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vicinity-evidence-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          name: vicinity-evidence-registry
          type: web
          property: host
      - key: AUTO_REGISTER_ELIGIBLE
        value: "true"
      - key: INGESTION_LOOKBACK_DAYS
        value: "7"
      - key: REVIEWER_TOKEN
        sync: false
      - key: INGESTION_TOKEN
        sync: false
      - key: ZOTERO_API_KEY
        sync: false
      - key: ZOTERO_LIBRARY_TYPE
        value: user
      - key: ZOTERO_LIBRARY_ID
        sync: false
      - key: ZOTERO_COLLECTION_ID
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false

  - type: web
    name: vicinity-evidence-registry
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        fromService:
          name: vicinity-evidence-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: vicinity-evidence-db
    plan: free
    region: virginia
    databaseName: vicinity
    user: vicinity
    postgresMajorVersion: "18"
    ipAllowList: []
